version: 2

updates:
  # npm / pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    reviewers:
      - "yck30"
    assignees:
      - "yck30"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Next.js 14 does not fully support ESLint 9/10 flat config in `next lint`.
      # Ignore major updates until we migrate to Next.js 15.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Next.js major upgrades (e.g., 14 -> 15/16) require synchronized upgrades to React 19,
      # Turbopack migration, and @next/mdx. Ignore automated major updates.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/*"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates to reduce PR noise
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      eslint-ecosystem:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3
    reviewers:
      - "yck30"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
